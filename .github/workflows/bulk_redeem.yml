name: Daily bulk redeem

on:
  schedule:
    # 12:00 Asia/Taipei (UTC+8) == 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      latest:
        description: "Only redeem the N codes with the latest expiry (ignored if codes given)"
        required: false
        default: "2"
      codes:
        description: "Comma/space-separated gift codes (overrides scrape)"
        required: false
        default: ""
      kingdom:
        description: "Comma-separated candidate kingdoms, tried in order (defaults to the KINGDOM repo variable, then the script's own list)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  redeem:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run bulk redeem
        env:
          LATEST: ${{ github.event.inputs.latest || '2' }}
          CODES: ${{ github.event.inputs.codes }}
          KINGDOM: ${{ github.event.inputs.kingdom || vars.KINGDOM }}
        run: |
          args=()
          # Empty KINGDOM is fine: the script falls back to its built-in
          # candidate list and caches whatever the site accepts per player.
          for k in $(echo "$KINGDOM" | tr ',' ' '); do
            args+=(--kingdom "$k")
          done
          if [[ -n "$CODES" ]]; then
            for c in $(echo "$CODES" | tr ',' ' '); do
              args+=(--code "$c")
            done
            python bulk_redeem.py "${args[@]}"
          else
            python bulk_redeem.py "${args[@]}" --codes-from-scrape --latest "$LATEST"
          fi

      - name: Commit resolved kingdoms
        run: |
          if [[ -n "$(git status --porcelain kingshot_players.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kingshot_players.csv
            git commit -m "Cache resolved kingdoms from bulk redeem"
            git push
          else
            echo "No kingdom changes to commit."
          fi
