<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KvK 前哨戰積分計算機</title>
<style>
:root{
  --bg:#181410;
  --surface:#221c15;
  --surface-2:#2b241b;
  --line:#3a3122;
  --ink:#ede3d0;
  --ink-dim:#b8ab8f;
  --gold:#c9a24a;
  --gold-bright:#e4bf6c;
  --jade:#6b9c85;
  --danger:#b5573f;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4efe3;
    --surface:#fffdf8;
    --surface-2:#ece3cd;
    --line:#d8cba7;
    --ink:#2a2318;
    --ink-dim:#6b5f47;
    --gold:#9c7a26;
    --gold-bright:#7d6118;
    --jade:#3f7a5e;
    --danger:#a1442d;
  }
}
:root[data-theme="light"]{
  --bg:#f4efe3;
  --surface:#fffdf8;
  --surface-2:#ece3cd;
  --line:#d8cba7;
  --ink:#2a2318;
  --ink-dim:#6b5f47;
  --gold:#9c7a26;
  --gold-bright:#7d6118;
  --jade:#3f7a5e;
  --danger:#a1442d;
}
:root[data-theme="dark"]{
  --bg:#181410;
  --surface:#221c15;
  --surface-2:#2b241b;
  --line:#3a3122;
  --ink:#ede3d0;
  --ink-dim:#b8ab8f;
  --gold:#c9a24a;
  --gold-bright:#e4bf6c;
  --jade:#6b9c85;
  --danger:#b5573f;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:32px 20px 80px;
}
header{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:20px;
  border-bottom:1px solid var(--line);
  padding-bottom:20px;
}
.eyebrow{
  font-family:"Cinzel",serif;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
}
h1{
  font-family:"Cinzel",serif;
  font-weight:600;
  font-size:clamp(26px,4vw,36px);
  margin:0;
  text-wrap:balance;
  letter-spacing:.01em;
}
.sub{
  color:var(--ink-dim);
  font-size:14px;
  max-width:64ch;
  line-height:1.6;
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:22px;
  padding-bottom:2px;
}
.tab{
  flex:0 0 auto;
  font-family:"Cinzel",serif;
  font-size:13px;
  letter-spacing:.05em;
  color:var(--ink-dim);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 16px;
  cursor:pointer;
}
.tab:hover{color:var(--ink);border-color:var(--gold);}
.tab[aria-selected="true"]{
  color:var(--bg);
  background:var(--gold);
  border-color:var(--gold);
}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.day-note{
  font-size:13px;
  color:var(--ink-dim);
  line-height:1.6;
  margin:0 0 20px;
  max-width:66ch;
  border-left:2px solid var(--gold);
  padding-left:12px;
}

.identity{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  margin-bottom:20px;
}
.identity-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  margin-top:14px;
}
@media(min-width:700px){
  .identity-grid{grid-template-columns:1fr 1fr 1.2fr;}
}
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  position:relative;
}
.field label{
  font-size:12px;
  color:var(--ink-dim);
  letter-spacing:.03em;
}
.field input{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--ink);
  font-family:"JetBrains Mono",monospace;
  font-size:14px;
  padding:9px 10px;
}
.id-row{display:flex;gap:8px;align-items:stretch;}
.id-row input{flex:1;}
.lookup-btn{
  flex:0 0 auto;
  font-size:12px;
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--ink-dim);
  border-radius:6px;
  padding:0 12px;
  cursor:pointer;
  white-space:nowrap;
}
.lookup-btn:hover{border-color:var(--gold);color:var(--ink);}
.lookup-btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.field input:focus{outline:none;border-color:var(--gold);}
.field input:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.field input[readonly]{
  color:var(--jade);
  border-color:var(--jade);
  background:var(--surface-2);
}
.id-matches{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  margin-top:4px;
  background:var(--surface);
  border:1px solid var(--gold);
  border-radius:8px;
  overflow:hidden;
  z-index:5;
  max-height:220px;
  overflow-y:auto;
}
.id-match{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 12px;
  font-size:13px;
  cursor:pointer;
  border-bottom:1px solid var(--line);
}
.id-match:last-child{border-bottom:none;}
.id-match:hover{background:var(--surface-2);}
.id-match b{color:var(--gold-bright);font-family:"JetBrains Mono",monospace;}
.id-match span{color:var(--ink-dim);font-size:12px;}
.guild-chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.guild-chip{
  font-size:13px;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--ink-dim);
  border-radius:999px;
  padding:7px 14px;
  cursor:pointer;
}
.guild-chip:hover{border-color:var(--gold);color:var(--ink);}
.guild-chip[aria-pressed="true"]{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--bg);
  font-weight:600;
}
.guild-chip:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.guild-add-input{
  width:110px;
  background:var(--bg);
  border:1px dashed var(--line);
  border-radius:999px;
  color:var(--ink);
  font-size:13px;
  padding:6px 12px;
}
.guild-add-input:focus{outline:none;border-color:var(--gold);}
.identity-status{
  margin:12px 0 0;
  font-size:13px;
  color:var(--jade);
  min-height:1.4em;
}
.identity-status.is-empty{color:var(--ink-dim);}

.round-banner{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  background:var(--surface);
  border:1px solid var(--gold);
  border-radius:10px;
  padding:12px 16px;
  margin-bottom:20px;
  font-size:13px;
}
.round-banner.is-visible{display:flex;}
.round-banner.is-closed{border-color:var(--danger);}
.round-banner-text{color:var(--ink-dim);}
.round-banner-text b{color:var(--gold-bright);}
.submit-row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.submit-btn{
  font-family:"Cinzel",serif;
  font-size:13px;
  letter-spacing:.05em;
  background:var(--gold);
  border:1px solid var(--gold);
  color:var(--bg);
  border-radius:8px;
  padding:10px 20px;
  cursor:pointer;
  font-weight:600;
}
.submit-btn:hover{background:var(--gold-bright);border-color:var(--gold-bright);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;}
.submit-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.submit-status{
  font-size:13px;
  color:var(--jade);
}
.submit-status.is-error{color:var(--danger);}

.avail{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  margin-bottom:24px;
}
.avail-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.avail-title{
  font-family:"Cinzel",serif;
  font-size:15px;
  letter-spacing:.03em;
  color:var(--gold-bright);
}
.avail-count{
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-size:13px;
  color:var(--jade);
}
.avail-hint{
  color:var(--ink-dim);
  font-size:13px;
  line-height:1.6;
  margin:6px 0 14px;
  max-width:66ch;
}
.avail-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
  gap:6px;
  margin-bottom:14px;
}
.slot{
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-size:12.5px;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--ink-dim);
  border-radius:6px;
  padding:8px 4px;
  text-align:center;
  cursor:pointer;
}
.slot:hover{border-color:var(--gold);color:var(--ink);}
.slot[aria-pressed="true"]{
  background:var(--jade);
  border-color:var(--jade);
  color:var(--bg);
  font-weight:600;
}
.slot.slot-daybreak{border-left:2px solid var(--gold);}
.slot:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}

.layout{
  display:grid;
  grid-template-columns:1fr;
  gap:24px;
}
@media(min-width:760px){
  .layout{grid-template-columns:1fr 300px;align-items:start;}
}

.groups{display:flex;flex-direction:column;gap:16px;}

.group{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}
.group-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:14px 18px;
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
}
.group-title{
  font-family:"Cinzel",serif;
  font-size:15px;
  letter-spacing:.03em;
  color:var(--gold-bright);
}
.group-subtotal{
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-size:13px;
  color:var(--ink-dim);
}
.group-subtotal b{color:var(--jade);font-weight:600;}

.rows{
  display:flex;
  flex-direction:column;
}
.row{
  display:grid;
  grid-template-columns:1fr 96px 96px;
  gap:10px;
  align-items:center;
  padding:11px 18px;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row-label{font-size:14px;line-height:1.4;}
.row-label small{display:block;color:var(--ink-dim);font-size:11px;margin-top:2px;}
.row-rate{
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
  color:var(--ink-dim);
  text-align:right;
  white-space:nowrap;
}
.row input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--ink);
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-size:14px;
  padding:7px 8px;
  text-align:right;
}
.row input:focus{
  outline:none;
  border-color:var(--gold);
}
.row input:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.row input::-webkit-outer-spin-button,
.row input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}

.row-duration{
  grid-template-columns:1fr auto;
}
.duration-inputs{
  display:flex;
  gap:8px;
}
.duration-inputs label{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  color:var(--ink-dim);
}
.duration-inputs input{
  width:56px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--ink);
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-size:14px;
  padding:7px 6px;
  text-align:right;
}
.duration-inputs input:focus{outline:none;border-color:var(--gold);}
.duration-inputs input:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.duration-inputs input::-webkit-outer-spin-button,
.duration-inputs input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}

/* summary panel */
.summary{
  position:sticky;
  top:20px;
  background:var(--surface);
  border:1px solid var(--gold);
  border-radius:10px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.summary-label{
  font-family:"Cinzel",serif;
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold);
}
.summary-total{
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-size:clamp(30px,6vw,40px);
  font-weight:700;
  color:var(--gold-bright);
  line-height:1;
  text-wrap:balance;
}
.summary-total span{font-size:15px;color:var(--ink-dim);font-weight:400;margin-left:6px;}
.summary-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:13px;
  border-top:1px solid var(--line);
  padding-top:12px;
}
.summary-list .li{
  display:flex;
  justify-content:space-between;
  color:var(--ink-dim);
}
.summary-list .li b{
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  font-weight:500;
}
.reset-btn{
  margin-top:4px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink-dim);
  border-radius:6px;
  padding:8px 10px;
  font-size:12px;
  cursor:pointer;
  font-family:inherit;
}
.reset-btn:hover{border-color:var(--danger);color:var(--danger);}
.reset-btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}

footer{
  margin-top:28px;
  color:var(--ink-dim);
  font-size:12px;
  line-height:1.7;
  border-top:1px solid var(--line);
  padding-top:16px;
}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Kingshot · KvK 前哨戰</div>
    <h1>王城戰前哨積分計算機</h1>
    <p class="sub">選擇天數，輸入你打算投入的材料數量與加速時間，即時換算前哨戰積分。每天的高效項目不同，投入前先確認狼隊、加速、首相三重 Buff 都已生效。</p>
  </header>

  <div class="round-banner" id="roundBanner">
    <span class="round-banner-text" id="roundBannerText"></span>
  </div>

  <section class="identity">
    <div class="avail-head">
      <span class="avail-title">回報者資訊</span>
    </div>
    <div class="identity-grid">
      <div class="field">
        <label for="playerId">角色 ID</label>
        <div class="id-row">
          <input type="text" id="playerId" inputmode="numeric" autocomplete="off" placeholder="輸入至少 3 碼開始搜尋">
          <button type="button" class="lookup-btn" id="lookupBtn" hidden>查詢上次登記</button>
        </div>
        <div class="id-matches" id="idMatches" hidden></div>
      </div>
      <div class="field">
        <label for="playerName">玩家名稱</label>
        <input type="text" id="playerName" autocomplete="off" placeholder="找不到 ID 時請手動輸入">
      </div>
      <div class="field">
        <label>聯盟名稱</label>
        <div class="guild-chips" id="guildChips"></div>
      </div>
    </div>
    <p class="identity-status" id="identityStatus"></p>
    <p class="avail-hint">名單為 kingshot_players.csv 的靜態快照，更新名單後需重新產生此頁面才會生效。</p>
    <div class="submit-row" id="submitRow" hidden>
      <button class="submit-btn" id="submitBtn" type="button">送出登記</button>
      <span class="submit-status" id="submitStatus"></span>
    </div>
  </section>

  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="day-note" id="dayNote"></p>

  <section class="avail">
    <div class="avail-head">
      <span class="avail-title">有空時段（GMT+8 台北時間）</span>
      <span class="avail-count" id="availCount">已選 0 段</span>
    </div>
    <p class="avail-hint">從當天早上 08:00 到隔天早上 08:00，每 30 分鐘一格，點選你這天有空上線參與活動的時段（可複選）。</p>
    <div class="avail-grid" id="availGrid"></div>
    <button class="reset-btn" id="availResetBtn" type="button">清空本日時段</button>
  </section>

  <div class="layout">
    <div class="groups" id="groups"></div>

    <div class="summary">
      <div class="summary-label">預估總積分</div>
      <div class="summary-total" id="grandTotal">0<span>分</span></div>
      <div class="summary-list" id="breakdown"></div>
      <button class="reset-btn" id="resetBtn" type="button">清空本日輸入</button>
    </div>
  </div>

  <footer id="footerNote"></footer>
</div>

<script>
// ---- 語言偵測：瀏覽器語言為中文則用中文，否則英文 ----
// 注意：有空時段一律以「時段索引」送出，伺服器端固定以 UTC+8 台灣時區解讀，
// 因此寫進 GitHub issue 的時間永遠是 UTC+8；英文介面只是把顯示標籤換算成 UTC+0。

document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en";
const LOCALE = LANG === "zh" ? "zh-TW" : "en-US";

const PLAYERS = PLAYERS_CSV.split("\n").map(line => {
  const fields = line.split(",");
  const id = fields[0];
  let name, kingdom;
  if (fields.length <= 3) {
    name = fields[1] || "";
    kingdom = fields[2] || "";
  } else {
    kingdom = fields[fields.length - 1];
    name = fields.slice(1, -1).join(",");
  }
  return { id, name, kingdom };
});

const playerIdInput = document.getElementById("playerId");
const playerNameInput = document.getElementById("playerName");
const idMatchesEl = document.getElementById("idMatches");

function setIdentityStatus(text, empty) {
  identityStatusEl.textContent = text;
  identityStatusEl.classList.toggle("is-empty", !!empty);
}

playerIdInput.addEventListener("input", () => {
  const query = playerIdInput.value.trim();
  playerNameInput.readOnly = false;

  if (query.length < 3) {
    idMatchesEl.hidden = true;
    idMatchesEl.innerHTML = "";
    setIdentityStatus(tr("輸入至少 3 碼角色 ID 開始搜尋名單。", "Type at least 3 digits of your character ID to search the roster."), true);
    return;
  }

  const matches = PLAYERS.filter(p => p.id.includes(query)).slice(0, 8);

  if (matches.length === 0) {
    idMatchesEl.hidden = true;
    idMatchesEl.innerHTML = "";
    setIdentityStatus(tr("名單中找不到符合的角色 ID，請自行輸入玩家名稱。", "No matching character ID in the roster — please enter your player name manually."));
    return;
  }

  idMatchesEl.hidden = false;
  idMatchesEl.innerHTML = "";
  matches.forEach(p => {
    const row = document.createElement("div");
    row.className = "id-match";
    row.innerHTML = `<b>${p.id}</b><span>${p.name || tr("（無名稱）", "(no name)")}${p.kingdom ? tr(" · 王國 ", " · Kingdom ") + p.kingdom : ""}</span>`;
    row.addEventListener("click", () => {
      playerIdInput.value = p.id;
      playerNameInput.value = p.name || "";
      playerNameInput.readOnly = !!p.name;
      idMatchesEl.hidden = true;
      setIdentityStatus(p.name ? tr("已從名單帶入玩家名稱。", "Player name filled in from the roster.") : tr("名單中此 ID 沒有名稱，請自行輸入。", "This ID has no name in the roster — please enter it yourself."));
    });
    idMatchesEl.appendChild(row);
  });

  const exact = PLAYERS.find(p => p.id === query);
  if (exact) {
    playerNameInput.value = exact.name || "";
    playerNameInput.readOnly = !!exact.name;
    idMatchesEl.hidden = true;
    setIdentityStatus(exact.name ? tr("已從名單帶入玩家名稱。", "Player name filled in from the roster.") : tr("名單中此 ID 沒有名稱，請自行輸入。", "This ID has no name in the roster — please enter it yourself."));
  } else {
    setIdentityStatus(tr(matches.length + " 筆相符，請從下方清單點選。", matches.length + " matches — pick one from the list below."), false);
  }
});

function saveGuildList() {
  try { localStorage.setItem(GUILD_STORAGE_KEY, JSON.stringify(guildList)); } catch {}

function renderGuildChips() {
  guildChipsEl.innerHTML = "";
  guildList.forEach(guild => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "guild-chip";
    chip.textContent = guild;
    const isSelected = selectedGuild && selectedGuild.toLowerCase() === guild.toLowerCase();
    chip.setAttribute("aria-pressed", isSelected ? "true" : "false");
    chip.addEventListener("click", () => {
      selectedGuild = isSelected ? null : guild;
      saveSelectedGuild();
      renderGuildChips();
    });
    guildChipsEl.appendChild(chip);
  });

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "guild-chip";
  addBtn.textContent = tr("+ 新增聯盟", "+ Add alliance");
  addBtn.addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "text";
    input.className = "guild-add-input";
    input.placeholder = tr("輸入聯盟名稱", "Alliance name");
    addBtn.replaceWith(input);
    input.focus();
    const commit = () => {
      const val = input.value.trim();
      if (val && !guildList.some(g => g.toLowerCase() === val.toLowerCase())) {
        guildList.push(val);
        saveGuildList();
        selectedGuild = val;
        saveSelectedGuild();
      }
      renderGuildChips();
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") renderGuildChips(); });
    input.addEventListener("blur", commit);
  });
  guildChipsEl.appendChild(addBtn);
}

// ---- 有空時段（GMT+8 台北時間，08:00 ~ 隔天 08:00，每 30 分鐘一格）----
const SLOTS = (() => {
  const list = [];
  let h = 8, m = 0, dayOffset = 0;
  for (let i = 0; i < 48; i++) {
    const label = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    list.push({ label, dayOffset });
    m += 30;
    if (m === 60) { m = 0; h += 1; }
    if (h === 24) { h = 0; dayOffset = 1; }
  }
  return list;
})();

// 時段顯示：中文用 GMT+8 台北時間（08:00 起，跨日標 +1）；
// 英文用 UTC+0（等於台北時間 -8 小時，剛好從 00:00 起排到 24:00）。
// 不論語言，送出的都是同一組時段索引，伺服器端固定以 UTC+8 記錄。
function slotDisplay(idx) {
  const s = SLOTS[idx];
  if (LANG === "zh") {
    return {
      text: s.label + (s.dayOffset === 1 ? "+1" : ""),
      aria: (s.dayOffset === 1 ? "隔天 " : "當天 ") + s.label,
    };
  }
  const total = idx * 30; // 分鐘，從 00:00 UTC 起算
  const h = Math.floor(total / 60), m = total % 60;
  const lbl = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  return { text: lbl, aria: lbl + " UTC" };
}

function availStorageKey(dayId) {

function saveAvailability(dayId, set) {

}

function renderAvailability(day) {
  const selected = loadAvailability(day.id);
  availGridEl.innerHTML = "";

  SLOTS.forEach((slot, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "slot" + (slot.dayOffset === 1 && SLOTS[idx - 1] && SLOTS[idx - 1].dayOffset === 0 ? " slot-daybreak" : "");
    const disp = slotDisplay(idx);
    btn.textContent = disp.text;
    btn.setAttribute("aria-pressed", selected.has(idx) ? "true" : "false");
    btn.setAttribute("aria-label", disp.aria);
    btn.addEventListener("click", () => {
      if (selected.has(idx)) selected.delete(idx); else selected.add(idx);
      btn.setAttribute("aria-pressed", selected.has(idx) ? "true" : "false");
      saveAvailability(day.id, selected);
      updateAvailCount(selected);
    });
    availGridEl.appendChild(btn);
  });

  updateAvailCount(selected);
}

function updateAvailCount(selected) {
  availCountEl.textContent = tr("已選 " + selected.size + " 段", selected.size + " selected");
}

function recalc() {
  let grand = 0;
  const perGroup = {};
  currentDay.groups.forEach(group => { perGroup[group.title] = 0; });

  document.querySelectorAll("input[data-key]").forEach(input => {
    const val = Math.max(0, parseFloat(input.value) || 0);
    const rate = parseFloat(input.dataset.rate);
    values[input.dataset.key] = val * rate;
    itemValues[input.dataset.key] = val || undefined;
  });

  const durationMinutes = {};
  document.querySelectorAll("input[data-durkey]").forEach(input => {
    const val = Math.max(0, parseFloat(input.value) || 0);
    const key = input.dataset.durkey;
    const perMinute = { d: 1440, h: 60, m: 1 }[input.dataset.unit];
    durationMinutes[key] = (durationMinutes[key] || 0) + val * perMinute;
    itemValues[key] = itemValues[key] && typeof itemValues[key] === "object" ? itemValues[key] : {};
    itemValues[key][input.dataset.unit] = val || undefined;
  });
  document.querySelectorAll("input[data-durkey]").forEach(input => {
    const key = input.dataset.durkey;
    const rate = parseFloat(input.dataset.rate);
    values[key] = (durationMinutes[key] || 0) * rate;
  });
  saveItemValues();

  currentDay.groups.forEach(group => {
    let sum = 0;
    group.items.forEach(item => { sum += values[item.key] || 0; });
    perGroup[group.title] = sum;
    grand += sum;
  });

  document.querySelectorAll(".group-subtotal").forEach(el => {
    const g = el.dataset.group;
    el.querySelector("b").textContent = Math.round(perGroup[g]).toLocaleString();
  });

  document.getElementById("grandTotal").innerHTML = Math.round(grand).toLocaleString() + tr("<span>分</span>", "<span>pts</span>");

  const breakdown = document.getElementById("breakdown");
  breakdown.innerHTML = "";
  currentDay.groups.forEach(group => {
    if (perGroup[group.title] > 0) {
      const li = document.createElement("div");
      li.className = "li";
      li.innerHTML = `<span>${group.title}</span><b>${Math.round(perGroup[group.title]).toLocaleString()}</b>`;
      breakdown.appendChild(li);
    }
  });
}

groupsEl.addEventListener("input", recalc);

document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll("input[data-key]").forEach(input => { input.value = ""; });
  recalc();
});

  return m ? Number(m[1]) : null;
}

const currentRound = getRoundFromHash();
const roundBannerEl = document.getElementById("roundBanner");
const roundBannerTextEl = document.getElementById("roundBannerText");
const submitRowEl = document.getElementById("submitRow");
const submitBtnEl = document.getElementById("submitBtn");
const submitStatusEl = document.getElementById("submitStatus");
const lookupBtnEl = document.getElementById("lookupBtn");

let roundInfo = null; // { round, issue, startDate, status, url }

function setSubmitStatus(text, isError) {
  submitStatusEl.textContent = text || "";
  submitStatusEl.classList.toggle("is-error", !!isError);
}

function collectAvailability() {
  const availability = {};
  DAYS.forEach(day => {
    availability[day.id] = [...loadAvailability(day.id)].sort((a, b) => a - b);
  });
  return availability;
}

function applyAvailability(availability) {
  if (!availability || typeof availability !== "object") return;
  DAYS.forEach(day => {
    const arr = Array.isArray(availability[day.id]) ? availability[day.id] : [];
    saveAvailability(day.id, new Set(arr));
  });
  renderAvailability(currentDay);
}

// ---- 道具數量：組成送出用的 raw/可讀文字，兩種都存進留言方便日後解析或人工看 ----
function collectItems() {
  const items = {};
  const itemsText = {};
  DAYS.forEach(day => {
    const raw = {};
    const text = [];
    day.groups.forEach(group => {
      group.items.forEach(item => {
        if (item.type === "duration") {
          const dur = itemValues[item.key];
          const d = (dur && dur.d) || 0, h = (dur && dur.h) || 0, m = (dur && dur.m) || 0;
          if (d || h || m) {
            raw[item.key] = { d, h, m };
            text.push(`${item.label}${tr("：", ": ")}${d}${tr(" 天 ", "d ")}${h}${tr(" 時 ", "h ")}${m}${tr(" 分", "m")}`);
          }
        } else {
          const val = itemValues[item.key] || 0;
          if (val) {
            raw[item.key] = val;
            text.push(`${item.label}${tr("：", ": ")}${val} ${item.unit}`);
          }
        }
      });
    });
    items[day.id] = raw;
    itemsText[day.id] = text;
  });
  return { items, itemsText };
}

function applyItems(items) {
  if (!items || typeof items !== "object") return;
  DAYS.forEach(day => {
    const dayItems = items[day.id] || {};
    day.groups.forEach(group => {
      group.items.forEach(item => {
        if (dayItems[item.key] !== undefined) itemValues[item.key] = dayItems[item.key];
      });
    });
  });
  saveItemValues();
  renderDay(currentDay);
}

async function fetchRoundInfo(round) {
  const r = await fetch(`${WORKER_URL}/api/kvk/rounds/${round}`);
  if (!r.ok) return null;
  return r.json();
}

async function fetchExistingSubmission(round, playerId) {
  const r = await fetch(`${WORKER_URL}/api/kvk/rounds/${round}/submissions/${encodeURIComponent(playerId)}`);
  if (!r.ok) return null;
  return r.json();
}

function renderRoundBanner() {
  if (!currentRound) {
    roundBannerEl.classList.remove("is-visible", "is-closed");
    submitRowEl.hidden = true;
    lookupBtnEl.hidden = true;
    return;
  }
  roundBannerEl.classList.add("is-visible");
  if (!roundInfo) {
    roundBannerEl.classList.remove("is-closed");
    roundBannerTextEl.innerHTML = tr(
      `KvK <b>#${currentRound}</b> 報名頁尚未開放（找不到這一屆，請確認連結或洽詢幹部）。`,
      `KvK <b>#${currentRound}</b> sign-up isn't open yet (this round wasn't found — check the link or ask an officer).`);
    submitRowEl.hidden = true;
    lookupBtnEl.hidden = true;
    return;
  }
  if (roundInfo.status === "closed") {
    roundBannerEl.classList.add("is-closed");
    roundBannerTextEl.innerHTML = tr(
      `KvK <b>#${currentRound}</b> 報名已截止，如需異動請直接聯絡幹部。`,
      `KvK <b>#${currentRound}</b> sign-up is closed. Contact an officer for changes.`);
    submitRowEl.hidden = true;
    lookupBtnEl.hidden = true;
    return;
  }
  roundBannerEl.classList.remove("is-closed");
  roundBannerTextEl.innerHTML = tr(
    `KvK <b>#${currentRound}</b> 前哨戰報名開放中，填完角色資訊與有空時段後記得按「送出登記」。`,
    `KvK <b>#${currentRound}</b> prep sign-up is open. Fill in your character info and availability, then hit "Submit entry".`);
  submitRowEl.hidden = false;
  lookupBtnEl.hidden = false;
}

async function tryPrefillFromServer(explicit) {
  const playerId = playerIdInput.value.trim();
  if (!currentRound || !roundInfo || roundInfo.status !== "open") return;
  if (!playerId) {
    if (explicit) setSubmitStatus(tr("請先輸入角色 ID。", "Enter your character ID first."), true);
    return;
  }
  if (explicit) setSubmitStatus(tr("查詢中…", "Looking up…"));
  try {
    const sub = await fetchExistingSubmission(currentRound, playerId);
    if (!sub) {
      if (explicit) setSubmitStatus(tr(`這一屆還沒有 ID ${playerId} 的登記紀錄。`, `No entry for ID ${playerId} in this round yet.`), true);
      return;
    }
    if (sub.playerName) playerNameInput.value = sub.playerName;
    if (sub.guild) {
      selectedGuild = sub.guild;
      if (!guildList.some(g => g.toLowerCase() === sub.guild.toLowerCase())) guildList.push(sub.guild);
      saveGuildList();
      saveSelectedGuild();
      renderGuildChips();
    }
    applyAvailability(sub.availability);
    applyItems(sub.items);
    const when = sub.submittedAt ? new Date(sub.submittedAt).toLocaleString(LOCALE, { hour12: false, timeZone: "Asia/Taipei" }) + " (UTC+8)" : "";
    setSubmitStatus(when
      ? tr(`已帶入上次登記內容（登記於 ${when}），可直接修改後重新送出。`, `Loaded your last entry (submitted ${when}). Edit and re-submit as needed.`)
      : tr("已帶入上次登記內容，可直接修改後重新送出。", "Loaded your last entry. Edit and re-submit as needed."));
  } catch (e) {
    if (explicit) setSubmitStatus(tr("查詢失敗：", "Lookup failed: ") + (e.message || e), true);
  }
}

playerIdInput.addEventListener("blur", () => {
  if (playerIdInput.value.trim().length >= 5) tryPrefillFromServer(false);
});

lookupBtnEl.addEventListener("click", () => tryPrefillFromServer(true));

async function submitRegistration() {
  if (!currentRound || !roundInfo || roundInfo.status !== "open") return;
  const playerId = playerIdInput.value.trim();
  const playerName = playerNameInput.value.trim();
  if (!playerId || !playerName) {
    setSubmitStatus(tr("請先填寫角色 ID 與玩家名稱。", "Fill in your character ID and player name first."), true);
    return;
  }
  submitBtnEl.disabled = true;
  setSubmitStatus(tr("送出中…", "Submitting…"));
  try {
    const { items, itemsText } = collectItems();
    const r = await fetch(`${WORKER_URL}/api/kvk/rounds/${currentRound}/submissions`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        playerId,
        playerName,
        guild: selectedGuild || "",
        availability: collectAvailability(),
        items,
        itemsText,
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    setSubmitStatus(tr("已登記，若時段有更新可重新送出。", "Entry recorded. Re-submit if your availability changes."));
  } catch (e) {
    setSubmitStatus(tr("送出失敗：", "Submit failed: ") + (e.message || e), true);
  } finally {
    setTimeout(() => { submitBtnEl.disabled = false; }, 5000);
  }
}

submitBtnEl.addEventListener("click", submitRegistration);

if (currentRound) {
  renderRoundBanner();
  fetchRoundInfo(currentRound).then(info => {
    roundInfo = info;
    renderRoundBanner();
    if (info && info.status === "open") tryPrefillFromServer();
  });
}
</script>
